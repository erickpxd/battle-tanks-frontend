<main class="game-page page-shell">
  <header class="game-header">
    <div>
      <p class="eyebrow">Campo de batalha</p>
      <h1>Battle City</h1>
      <p>
        Comandante: <strong>{{ playerName }}</strong>
      </p>
    </div>
    <div class="header-actions">
      <span class="status" [class.status--connected]="connectionStatus === 'connected'">
        {{ connectionLabel() }}
      </span>
      <button type="button" class="button button--secondary" (click)="backToWaitingRoom()">
        Voltar à sala
      </button>
    </div>
  </header>

  <section class="battle-panel">
    <app-game-canvas />
  </section>

  <aside class="controls" aria-label="Controles do tanque">
    <strong>Controles</strong>
    <span><kbd>W</kbd> ou <kbd>↑</kbd> Cima</span>
    <span><kbd>S</kbd> ou <kbd>↓</kbd> Baixo</span>
    <span><kbd>A</kbd> ou <kbd>←</kbd> Esquerda</span>
    <span><kbd>D</kbd> ou <kbd>→</kbd> Direita</span>
  </aside>

  @if (connectionStatus !== 'connected') {
    <p class="offline-note">
      O tanque local permanece jogável. Posições remotas dependem do servidor WebSocket.
    </p>
  }
</main>
